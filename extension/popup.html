<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nolex</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <!-- Главный экран -->
    <div id="main-screen" class="screen">
        <header class="header">
            <div class="header-left">
                <img src="icons/icon48.png" alt="Nolex" class="logo">
                <h1>Nolex</h1>
            </div>
            <button id="menu-btn" class="icon-btn" title="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </header>

        <div class="content">
            <!-- Toggle Section -->
            <div class="toggle-section">
                <div class="toggle-info">
                    <label class="toggle-label">Extension Status</label>
                    <span id="status-text" class="status-text">Active</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="extension-toggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <!-- Statistics Section -->
            <div class="statistics-section">
                <h2 class="section-title">Detected Sensitive Data</h2>
                <div id="total-count" class="total-count">
                    <span class="count-number">0</span>
                    <span class="count-label">Total Findings</span>
                </div>

                <div id="stats-list" class="stats-list">
                    <!-- Динамически генерируется через popup.js -->
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            <path d="M9 12l2 2 4-4"></path>
                        </svg>
                        <p>No sensitive data detected yet</p>
                        <small>Start using the web to see statistics</small>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <button id="reset-btn" class="secondary-btn">Reset Statistics</button>
            </div>
        </div>
    </div>

    <!-- Экран меню -->
    <div id="menu-screen" class="screen hidden">
        <header class="header">
            <h1>Menu</h1>
            <button id="close-menu-btn" class="icon-btn" title="Close">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </header>

        <div class="content">
            <nav class="menu-nav">
                <a href="#" class="menu-item" data-action="personal-account">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Personal Account</span>
                    <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>

                <a href="#" class="menu-item" data-action="about-us">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 16v-4"></path>
                        <path d="M12 8h.01"></path>
                    </svg>
                    <span>About Us</span>
                    <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>

                <a href="#" class="menu-item" data-action="data-constructor">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Data Constructor</span>
                    <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>

                <a href="#" class="menu-item" data-action="support">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>Support</span>
                    <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>
            </nav>

            <div class="menu-footer">
                <p class="version">Version 2.0</p>
                <p class="copyright">© 2026 Nolex. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
